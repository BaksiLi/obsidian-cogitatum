name: Release

# Obsidian installs the release whose tag equals manifest.json's version, without a "v" prefix.
on:
  push:
    tags: ["[0-9]*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Tag must name the manifest version
        run: test "$GITHUB_REF_NAME" = "$(node -p 'require("./manifest.json").version')"
      - run: npm ci
      - run: npm exec --no -- playwright install --with-deps chromium
      - run: npm run release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $prerelease \
            dist/main.js dist/manifest.json dist/styles.css "releases/cogitatum-$GITHUB_REF_NAME.zip"
